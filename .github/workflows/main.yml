name: Daily Mini Coaching

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
      timezone: 'Asia/Tehran'

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      - name: Send daily Mini Coaching
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DAY=$(date +%-d)

          case $DAY in
            1)
              MESSAGE="زیبا، امروز قرار نیست همه‌چیز را یک‌دفعه درست کنی. فقط یک قدم درست بردار. در ترید، اجرای درست پلن مهم‌تر از نتیجه یک معامله است."
              ;;
            2)
              MESSAGE="امروز به خودت یادآوری کن: من مجبور نیستم هر حرکتی را معامله کنم. بازار همیشه فرصت دیگری خواهد داشت. صبر هم بخشی از استراتژی است."
              ;;
            3)
              MESSAGE="زیبا، قبل از ورود به معامله از خودت بپرس: آیا این معامله واقعاً طبق پلن من است؟ اگر جواب نه است، بهترین معامله امروز می‌تواند همان معامله نکردن باشد."
              ;;
            4)
              MESSAGE="امروز دنبال هیجان نباش؛ دنبال نظم باش. یک معامله آرام و مطابق پلن، ارزشمندتر از چند ورود عجولانه است."
              ;;
            5)
              MESSAGE="اگر یک معامله ضررده شد، به معنی شکست تو نیست. سؤال درست این است: آیا طبق قوانینم عمل کردم؟ نتیجه را نمی‌توانم کنترل کنم؛ اجرای خودم را می‌توانم کنترل کنم."
              ;;
            6)
              MESSAGE="زیبا، عجله دشمن تمرکز است. قبل از هر ورود چند ثانیه مکث کن، ساختار بازار را ببین، حجم را بررسی کن و بعد تصمیم بگیر."
              ;;
            7)
              MESSAGE="امروز فقط یک مأموریت: از سرمایه‌ات محافظت کن. فرصت‌های بازار تمام نمی‌شوند، اما سرمایه بدون مدیریت ریسک می‌تواند از بین برود."
              ;;
            8)
              MESSAGE="تو لازم نیست امروز ثابت کنی که تریدر بزرگی هستی. فقط لازم است امروز مثل یک تریدر منظم رفتار کنی."
              ;;
            9)
              MESSAGE="زیبا، سود کوچک و منظم نتیجه نظم است؛ اما هدف اصلی تو اجرای درست سیستم است. اجازه بده نتیجه در طول مجموعه‌ای از معاملات خودش را نشان دهد."
              ;;
            10)
              MESSAGE="وقتی بازار مبهم است، نداشتن معامله هم یک تصمیم حرفه‌ای است. ابهام را با اجبار به ورود حل نکن."
              ;;
            11)
              MESSAGE="امروز قبل از ورود: نقطه ورود، حد ضرر و حد سودت را مشخص کن. اگر نمی‌دانی کجا باید خارج شوی، هنوز زمان ورود نرسیده است."
              ;;
            12)
              MESSAGE="زیبا، اعتمادبه‌نفس واقعی از پیش‌بینی بازار نمی‌آید؛ از این می‌آید که بدانی اگر تحلیل اشتباه شد، دقیقاً چه کار خواهی کرد."
              ;;
            13)
              MESSAGE="یک نفس عمیق. بازار دشمن تو نیست. لازم نیست از بازار چیزی بگیری. فقط منتظر موقعیتی باش که با مزیت آماری سیستم تو هماهنگ باشد."
              ;;
            14)
              MESSAGE="امروز احساساتت را مشاهده کن، نه اینکه از آنها فرمان بگیری. ترس، طمع و عجله می‌توانند دیده شوند؛ اما تصمیم را قوانینت می‌گیرند."
              ;;
            15)
              MESSAGE="زیبا، معامله‌ای که طبق پلن بسته شده—even اگر ضررده باشد—می‌تواند یک معامله خوب باشد. معیار امروزت کیفیت تصمیم باشد، نه فقط مقدار سود."
              ;;
            16)
              MESSAGE="اگر چند معامله پشت سر هم سود کردی، هنوز قوانینت را تغییر نده. اگر چند معامله ضررده شد، باز هم قوانینت را از روی احساس تغییر نده. ثبات یعنی همین."
              ;;
            17)
              MESSAGE="امروز به جای اینکه بگویی بازار چه خواهد کرد، بپرس: اگر این اتفاق افتاد، من چه کار می‌کنم؟ این تغییر سؤال، ذهن تریدر را حرفه‌ای‌تر می‌کند."
              ;;
            18)
              MESSAGE="زیبا، فرصت خوب معمولاً نیاز به تعقیب کردن ندارد. اگر قیمت بدون تو حرکت کرد، بگذار برود. ورود دیرهنگام برای جبران置 ماندن می‌تواند خطرناک باشد."
              ;;
            19)
              MESSAGE="امروز کیفیت را به تعداد ترجیح بده. یک ستاپ واضح بهتر از چند معامله متوسط است."
              ;;
            20)
              MESSAGE="قبل از شروع بازار به خودت قول بده: برای جبران ضرر وارد معامله نمی‌شوم، برای هیجان وارد نمی‌شوم، فقط برای ستاپ معتبر وارد می‌شوم."
              ;;
            21)
              MESSAGE="زیبا، رشد واقعی در ترید آرام و تدریجی است. هر روز یک اشتباه کمتر و یک تصمیم بهتر، تو را به نسخه حرفه‌ای‌تر خودت نزدیک می‌کند."
              ;;
            22)
              MESSAGE="اگر امروز بازار طبق تحلیل تو حرکت نکرد، ناراحت نشو. بازار موظف نیست تحلیل ما را تأیید کند. وظیفه ما مدیریت سناریوهاست."
              ;;
            23)
              MESSAGE="امروز قبل از کلیک روی Buy یا Sell، یک سؤال ساده: آیا اگر این معامله ضررده شود، باز هم از اجرای آن راضی خواهم بود؟ اگر جواب نه است، مکث کن."
              ;;
            24)
              MESSAGE="زیبا، صبر کردن بخشی از کار تریدر است، نه زمان تلف‌شده. خیلی از فرصت‌های خوب دقیقاً بعد از دوره‌های انتظار ظاهر می‌شوند."
              ;;
            25)
              MESSAGE="امروز روی فرایند تمرکز کن: تحلیل، تأیید، ورود، حد ضرر، حد سود، ثبت معامله. نتیجه هر معامله فقط یک نمونه از یک مجموعه بزرگ‌تر است."
              ;;
            26)
              MESSAGE="تو قرار نیست بازار را کنترل کنی. فقط سه چیز در اختیار توست: تصمیم، ریسک و واکنش تو بعد از نتیجه."
              ;;
            27)
              MESSAGE="زیبا، اگر احساس کردی باید سریع وارد شوی چون ممکن است فرصت از دست برود، دقیقاً همان لحظه کمی مکث کن. FOMO نباید جایگزین ستاپ شود."
              ;;
            28)
              MESSAGE="امروز با خودت مهربان اما منضبط باش. اشتباه را ثبت کن، دلیلش را پیدا کن و دوباره طبق سیستم برگرد."
              ;;
            29)
              MESSAGE="یک تریدر حرفه‌ای همیشه در بازار حضور ندارد. او وقتی حضور دارد که شرایط مناسب باشد. نبودن در بازار هم بخشی از مدیریت سرمایه است."
              ;;
            30)
              MESSAGE="زیبا، مسیر تو با یک معامله ساخته نمی‌شود؛ با ده‌ها و صدها تصمیم ساخته می‌شود. امروز فقط یکی از آن تصمیم‌ها را درست بگیر."
              ;;
          esac

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$MESSAGE"
