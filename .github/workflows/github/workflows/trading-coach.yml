name: Trading Coach Every 10 Hours

on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *'
    - cron: '30 6 * * *'
    - cron: '30 16 * * *'

jobs:
  trading-coach:
    runs-on: ubuntu-latest

    steps:
      - name: Send Trading Coaching
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python3 - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

