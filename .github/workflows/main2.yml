name: Daily Mini Coaching

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
      timezone: 'Asia/Tehran'

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      - name: Send daily Mini Coaching
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          DAY=$(date +%-d)
          INDEX=$(( (DAY - 1) % 30 + 1 ))

          case $INDEX in

            1)
              MESSAGE=$(cat <<'EOF'
زیبا، امروز را با عجله شروع نکن.

قبل از اینکه سراغ گوشی، بازار، کارها و نگرانی‌های روز بروی، چند لحظه مکث کن و به خودت یادآوری کن که زندگی فقط فهرستی از کارهای انجام‌نشده نیست. همین که امروز فرصت داری دوباره شروع کنی، خودش یک نعمت است.

امروز برای چه چیزهایی شکرگزار هستی؟
برای نفس کشیدنت.
برای خانواده‌ات.
برای بچه‌هایت.
برای فرصت یادگرفتن.
برای اینکه هنوز می‌توانی اشتباهات گذشته را اصلاح کنی.
برای اینکه هنوز فرصت داری آدمی را که می‌خواهی باشی، بسازی.

شکرگزاری به این معنی نیست که مشکلات را انکار کنیم. یعنی اجازه ندهیم مشکلات تمام توجه ما را بگیرند.

در روان‌شناسی، توجه یکی از مهم‌ترین منابع ذهن است. اگر تمام روز روی چیزهایی که نداری تمرکز کنی، مغزت احساس کمبود می‌کند؛ حتی اگر چیزهای ارزشمند زیادی داشته باشی.

در ترید هم همین اتفاق می‌افتد. اگر بعد از یک معامله فقط به سودی که «می‌توانستی» بگیری فکر کنی، ذهنت وارد حسرت می‌شود. بعد حسرت تبدیل به عجله می‌شود و عجله می‌تواند به FOMO و ورودهای بد منجر شود.

تو لازم نیست بازار را شکست بدهی. لازم است خودت را بهتر مدیریت کنی.

اگر معامله‌ای طبق پلن بود و حد ضرر خورد، قبل از قضاوت خودت بپرس:
«آیا تصمیم من درست بود، حتی اگر نتیجه خوب نبود؟»

اگر جواب بله است، آن ضرر الزاماً شکست نیست.

امروز با آسنا و ارسلان هم یک کار مهم انجام بده: حداقل یک بار به جای اینکه سریع جواب مسئله‌شان را بدهی، از آنها بپرس:
«خودت چه فکری می‌کنی؟ راه دیگری هم به ذهنت می‌رسد؟»

ما نمی‌خواهیم بچه‌هایی تربیت کنیم که فقط جواب درست را حفظ کرده‌اند. می‌خواهیم بچه‌هایی داشته باشیم که وقتی با مسئله‌ای روبه‌رو شدند، بتوانند فکر کنند.

و یک نکته مهم برای خودت:
لازم نیست مادر کامل باشی.
لازم نیست تریدر کامل باشی.
لازم نیست همیشه آرام و باانگیزه باشی.

فقط باید هر روز کمی آگاه‌تر از دیروز رفتار کنی.

امروز مأموریتت این است:
قبل از اولین تصمیم مهم روز، سه نفس آرام بکش و از خودت بپرس:
«این تصمیم از آرامش می‌آید یا از ترس و عجله؟»

خدایا برای فرصت امروز شکر.
کمکم کن چیزی را که در اختیار من است، درست انجام دهم و درباره چیزهایی که در اختیار من نیست، آرام‌تر باشم.

امشب از خودت بپرس:
امروز چه چیزی را بهتر از دیروز انجام دادم؟

همین سؤال ساده، اگر هر روز تکرار شود، کم‌کم تو را تغییر می‌دهد.
EOF
