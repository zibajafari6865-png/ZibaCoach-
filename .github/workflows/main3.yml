🎓 DAY 1 — SEASONS
🌱 Vocabulary + Grammar + Speaking Foundation

امروز موضوع ما فصل‌هاست، اما قرار نیست فقط
Spring = بهار
Summer = تابستان
را حفظ کنیم.

هدف امروز این است که بتوانی درباره فصل مورد علاقه‌ات صحبت کنی.

━━━━━━━━━━━━━━━━━━

🧠 CORE VOCABULARY

spring = بهار
