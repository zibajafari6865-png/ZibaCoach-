name: Trading Coach Every 10 Hours

on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *'
    - cron: '30 6 * * *'
    - cron: '30 16 * * *'

jobs:
  trading-coach:
    runs-on: ubuntu-latest

    steps:
      - name: Send Trading Coaching
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          cat > coach.py <<'PY'
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          TOKEN = os.environ["TELEGRAM_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          messages = [
              """🔥 کوچینگ ترید

🧠 ذهنیت: تو نتیجه معامله را کنترل نمی‌کنی؛ فقط ریسک و رفتارت را کنترل می‌کنی.
🎯 انضباط: اگر ستاپ کامل نیست، وارد نشو.
📈 آموزش: کیفیت اجرای ۲۰ معامله مهم‌تر از نتیجه یک معامله است.
📚 Trading in the Zone: بازار همیشه عدم قطعیت دارد.
💪 اعتمادبه‌نفس از اجرای درست پلن می‌آید، نه از پیش‌بینی بازار.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: ضررِ طبق پلن، شکست نیست.
🎯 انضباط: بعد از Stop Loss فوراً دنبال جبران نباش.
📈 آموزش: ریسک ثابت، پایه بقای معامله‌گر است.
📚 Mark Douglas: معامله‌گر حرفه‌ای با احتمال‌ها کار می‌کند.
💪 یک ضرر فقط یک نمونه از یک مجموعه بزرگ معاملات است.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: FOMO یعنی ترس از جا ماندن؛ اما بازار همیشه فرصت بعدی دارد.
🎯 انضباط: کندلی که از دست رفت، دیگر ستاپ تو نیست.
📈 آموزش: ورود دیرهنگام معمولاً نسبت ریسک به بازده را خراب می‌کند.
📚 Al Brooks: منتظر Price Action قابل اعتماد بمان.
💪 آرام ماندن خودش یک مهارت معاملاتی است.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: Revenge Trading یعنی تلاش احساسی برای جبران ضرر.
🎯 انضباط: معامله بعدی را مستقل از معامله قبلی بررسی کن.
📈 آموزش: Daily Loss Limit می‌تواند جلوی ضرر زنجیره‌ای را بگیرد.
📚 Trading for a Living بر کنترل ریسک تأکید دارد.
💪 بازار محل انتقام گرفتن نیست.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: لازم نیست هر روز معامله کنی.
🎯 انضباط: No Trade هم یک تصمیم حرفه‌ای است.
📈 آموزش: کیفیت Setup از تعداد معاملات مهم‌تر است.
📚 معامله‌گر حرفه‌ای منتظر مزیت آماری می‌ماند.
💪 گاهی بهترین معامله، معامله نکردن است.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: یک معامله خوب می‌تواند ضررده باشد.
🎯 انضباط: نتیجه را با اجرای پلن اشتباه نگیر.
📈 آموزش: Process را بسنج، نه فقط Profit را.
📚 Trading in the Zone روی پذیرش عدم قطعیت تأکید دارد.
💪 کار تو اجرای سیستم است، نه کنترل بازار.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: Stop Loss دشمن تو نیست؛ هزینه کسب‌وکار توست.
🎯 انضباط: قبل از ورود بدان کجا اشتباهت ثابت می‌شود.
📈 آموزش: SL باید با ساختار بازار هماهنگ باشد.
📚 مدیریت ریسک پایه بقای معامله‌گر است.
💪 اول بقا، بعد رشد حساب.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: عجله برای سود باعث خروج زودهنگام می‌شود.
🎯 انضباط: TP و شرایط خروج را قبل از ورود مشخص کن.
📈 آموزش: Exit Strategy به اندازه Entry مهم است.
📚 Mark Douglas درباره پذیرش عدم قطعیت صحبت می‌کند.
💪 اجازه بده معامله طبق پلن خودش حرکت کند.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: اعتمادبه‌نفس با تکرار رفتار درست ساخته می‌شود.
🎯 انضباط: حتی با حساب کوچک، حرفه‌ای رفتار کن.
📈 آموزش: Journal بهترین آینه عملکرد توست.
📚 Brett Steenbarger روی تمرین هدفمند تأکید دارد.
💪 هر معامله یک داده برای شناخت بهتر خودت است.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: بازار به تو بدهکار نیست.
🎯 انضباط: فقط وقتی مزیت معاملاتی داری ریسک کن.
📈 آموزش: Edge یعنی مزیتی که در تعداد زیادی معامله معنا پیدا می‌کند.
📚 معامله‌گری حرفه‌ای بر احتمال‌ها بنا شده است.
💪 دنبال قطعیت نباش؛ دنبال اجرای مزیت باش.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: بعد از چند برد، مغرور نشو.
🎯 انضباط: حجم معامله را بدون دلیل سیستماتیک تغییر نده.
📈 آموزش: Winning Streak به معنی شکست‌ناپذیر شدن سیستم نیست.
📚 حرفه‌ای‌ها بعد از برد هم ریسک را کنترل می‌کنند.
💪 بردهای متوالی مجوز بی‌انضباطی نیستند.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: بعد از چند ضرر، فوراً سیستم را عوض نکن.
🎯 انضباط: ابتدا داده‌های Journal را بررسی کن.
📈 آموزش: Drawdown بخشی از بسیاری از سیستم‌های معاملاتی است.
📚 قبل از تغییر سیستم، Sample Size را در نظر بگیر.
💪 تصمیم احساسی وسط Drawdown مشکل را بزرگ‌تر می‌کند.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: بازار را مجبور نکن با تحلیل تو هماهنگ شود.
🎯 انضباط: اگر Price Action خلاف سناریو شد، سناریو را بازبینی کن.
📈 آموزش: Invalidation یعنی نقطه‌ای که تحلیل دیگر معتبر نیست.
📚 معامله‌گر حرفه‌ای به نظر قبلی خودش وابسته نمی‌ماند.
💪 انعطاف‌پذیری یک مهارت است.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: Candlestick فقط شکل نیست؛ نتیجه رفتار خریداران و فروشندگان است.
🎯 انضباط: کندل را در Context بازار بخوان.
📈 آموزش: Location از خود کندل مهم‌تر است.
📚 Price Action بدون Context می‌تواند گمراه‌کننده باشد.
💪 همیشه بپرس: این کندل کجا تشکیل شده است؟""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: Volume را به‌تنهایی معامله نکن.
🎯 انضباط: حجم را کنار Price Action و Location بررسی کن.
📈 آموزش: افزایش حجم همیشه به معنی خرید نیست.
📚 Volume وقتی ارزشمندتر است که با ساختار قیمت هماهنگ باشد.
💪 دنبال تأیید چندگانه باش، نه یک سیگنال تنها.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: تایم‌فریم بالاتر به تو Context می‌دهد.
🎯 انضباط: قبل از ورود در تایم پایین، ساختار تایم بالاتر را ببین.
📈 آموزش: HTF Bias می‌تواند جلوی بسیاری از معاملات خلاف‌روند را بگیرد.
📚 Multi-Timeframe Analysis یعنی تصویر بزرگ و جزئیات ورود.
💪 اول نقشه، بعد ماشه ورود.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: هر حرکت سریع قیمت فرصت ورود نیست.
🎯 انضباط: Chasing Price را متوقف کن.
📈 آموزش: بعد از حرکت شدید، منتظر Pullback یا ساختار مناسب بمان.
📚 ورود با تأخیر معمولاً R:R را ضعیف می‌کند.
💪 بازار را تعقیب نکن.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: تو قرار نیست سقف و کف بازار را دقیق شکار کنی.
🎯 انضباط: بخشی از حرکت برای بازار باقی می‌ماند.
📈 آموزش: گرفتن بخش میانی حرکت هم می‌تواند کافی باشد.
📚 حرفه‌ای‌ها روی اجرای مزیت تمرکز دارند.
💪 کامل‌گرایی دشمن اجرای پایدار است.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: اگر نمی‌توانی توضیح بدهی چرا وارد شدی، احتمالاً نباید وارد شوی.
🎯 انضباط: قبل از Buy یا Sell دلیل ورود را در یک جمله بگو.
📈 آموزش: Trade Thesis باید ساده و مشخص باشد.
📚 Journal نویسی فکرهای مبهم را آشکار می‌کند.
💪 معامله‌ای که دلیل ندارد، مدیریت خوبی هم نخواهد داشت.""",

              """🔥 کوچینگ ترید

🧠 ذهنیت: هدف امروز پول نیست؛ اجرای حرفه‌ای است.
🎯 انضباط: فقط ستاپ‌های A+ را دنبال کن.
📈 آموزش: کیفیت Setup را قبل از ورود مشخص کن.
📚 معامله‌گر حرفه‌ای کیفیت تصمیم را اندازه می‌گیرد.
💪 امروز یک قدم حرفه‌ای‌تر از دیروز عمل کن."""
          ]

          start = datetime(
              2026, 9, 18, 20, 30,
              tzinfo=timezone.utc
          )

          now = datetime.now(timezone.utc)

          elapsed_slots = int(
              (now - start).total_seconds() // 36000
          )

          index = elapsed_slots % len(messages)
          message = messages[index]

          url = "https://api.telegram.org/bot" + TOKEN + "/sendMessage"

          data = urllib.parse.urlencode({
              "chat_id": CHAT_ID,
              "text": message
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:
              print(response.read().decode("utf-8"))

          print("Trading coaching message sent successfully.")
          PY

          python3 coach.py
